# This file describes the network interfaces available on your system
# and how to activate them. For more information, see interfaces(5).
$define _enx            trunk0 # main ethernet trunk
$define _wlv_iot        radio0
$define _wlv_mobile     radio1
$define _wlv_external   radio2
$define _wlv_guest      radio3
$define _vlan_iot       100
$define _vlan_mobile    200
$define _vlan_external  300
$define _vlan_guest     400

source /etc/network/interfaces.d/*

# The loopback network interface
auto lo
iface lo inet loopback

#####################################################
#                  Ethernet trunk                   #
#####################################################

auto ${_enx}
allow-hotplug ${_enx}
iface ${_enx} inet manual
    # Native/untagged management VLAN on ${_enx}.
    # Tagged service VLANs: iot=${_vlan_iot}, mobile=${_vlan_mobile}, external=${_vlan_external}, guest=${_vlan_guest}
    bridge-vids 1 ${_vlan_iot} ${_vlan_mobile} ${_vlan_external} ${_vlan_guest} 
    bridge-pvid 1

#####################################################
#              Wireless AP interfaces               #
#####################################################

# Access-style AP ports. Untagged Wi-Fi traffic is classified into the given VLAN.
auto ${_wlv_iot}
iface ${_wlv_iot} inet manual
    bridge-access ${_vlan_iot}

auto ${_wlv_mobile}
iface ${_wlv_mobile} inet manual
    bridge-access ${_vlan_mobile}

auto ${_wlv_external}
iface ${_wlv_external} inet manual
    bridge-access ${_vlan_external}

auto ${_wlv_guest}
iface ${_wlv_guest} inet manual
    bridge-access ${_vlan_guest}

#####################################################
#               VLAN-aware bridge                   #
#####################################################

# VLAN-aware bridge that aggregates the trunk and AP interfaces.
# The bridge is configured to request an IP address via DHCP on the native/management VLAN (VLAN 1).
auto br_trunk
iface br_trunk inet dhcp
    hwaddress ether a1:b2:c3:d4:e5:f6 # Optional: set a fixed MAC address for the bridge matching your upstream DHCP reservations.
    bridge-vlan-aware yes
    bridge-ports ${_enx} ${_wlv_iot} ${_wlv_mobile} ${_wlv_external} ${_wlv_guest} 
    bridge-stp off
    bridge-fd 0
    bridge-vids 1 ${_vlan_iot} ${_vlan_mobile} ${_vlan_external} ${_vlan_guest}
    bridge-pvid 1
